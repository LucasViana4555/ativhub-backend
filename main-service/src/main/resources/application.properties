spring.application.name=AtivHub
server.forward-headers-strategy=native

# Configurações do Banco de Dados (Suporta Neon e Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ativhub_core}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Message Broker ActiveMQ Artemis (JMS) - Desativado
# spring.artemis.mode=${ARTEMIS_MODE:embedded}
# spring.artemis.broker-url=tcp://${ARTEMIS_HOST:localhost}:61616
# spring.artemis.user=${ARTEMIS_USER:admin}
# spring.artemis.password=${ARTEMIS_PASSWORD:admin}

# Configurações do Apache Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}

# Exclui autoconfigurações do RabbitMQ e Artemis/JMS para evitar erros se os brokers não estiverem ativos
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.jms.artemis.ArtemisAutoConfiguration,org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration

# Habilitação das Mensagerias
ativhub.messaging.jms.enabled=false
ativhub.messaging.rabbitmq.enabled=false
ativhub.messaging.kafka.enabled=true

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuração do JWT
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-muito-segura-e-longa-para-o-ativihub-2024}

# Configurações do Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

