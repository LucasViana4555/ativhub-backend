# H2 Database configuration for test profile
spring.datasource.url=jdbc:h2:mem:ativhub_core;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable ddl-auto for tests to generate tables from Entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for tests
spring.flyway.enabled=false

# Kafka configuration dummy for tests
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

# Fake credentials for Google OAuth2 to allow Spring context initialization in tests
GOOGLE_CLIENT_ID=fake-google-client-id
GOOGLE_CLIENT_SECRET=fake-google-client-secret
JWT_SECRET=uma-chave-secreta-muito-segura-e-longa-para-o-ativihub-teste-2024
